<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firma Digital Topaz</title>
<link rel="stylesheet" href="/css/firma/firma.css">

<script src="/js/firma/SigPlusExtLiteWrapper.js"></script>

</head>
<body onload="GetVersionInfo()">

    <div class="container">

        <div class="header">
            <h1>Firma Digital Topaz</h1>
            <p>Captura de firma electrónica con SigPlusExtLite</p>
        </div>

        <!-- Formulario de consulta -->
        <div class="card">
            <div class="card-title">Consulta de Paciente</div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="tipoDoc">Tipo Identificación <span style="color:var(--danger)">*</span></label>
                    <select id="tipoDoc">
                        <option value="">-- Selecciona --</option>
                        <option value="CC">CC - Cédula de Ciudadanía</option>
                        <option value="TI">TI - Tarjeta de Identidad</option>
                        <option value="CE">CE - Cédula de Extranjería</option>
                        <option value="RC">RC - Registro Civil</option>
                        <option value="PA">PA - Pasaporte</option>
                        <option value="MS">MS - Menor sin identificación</option>
                        <option value="AS">AS - Adulto sin identificación</option>
                        <option value="NIT">NIT</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="identificacion">N° Identificación <span style="color:var(--danger)">*</span></label>
                    <input type="text" id="identificacion" placeholder="Ej. 1234567890">
                </div>

                <div class="form-group">
                    <label for="idAtencion">Id Atención <span style="color:var(--danger)">*</span></label>
                    <input type="number" id="idAtencion" placeholder="Ej. 98765">
                </div>
            </div>

            <div class="buttons">
                <button type="button" class="btn-primary" id="btnConsultar" onclick="consultarPaciente()">
                    Consultar
                </button>
                <button type="button" class="btn-secondary" onclick="limpiarFormulario()">
                    Limpiar
                </button>
            </div>

            <div class="error-msg" id="errorConsulta"></div>

            <div class="resultado-box" id="resultadoBox">
                <table id="resultadoTabla">
                    <thead><tr id="resultadoHead"></tr></thead>
                    <tbody id="resultadoBody"></tbody>
                </table>
            </div>
        </div>

        <form name="MainForm" id="firmaSection" class="firma-disabled">

            <!-- Campos ocultos internos -->
            <textarea name="sigStringData" style="display:none;"></textarea>
            <textarea name="sigRawData" style="display:none;"></textarea>

            <div class="card">
                <div class="card-title">Área de Firma</div>

                <canvas id="cnv" width="500" height="120"></canvas>

                <div class="buttons">
                    <button type="button" class="btn-primary" onclick="BasicDemoStartSignEx()">
                        Iniciar Firma
                    </button>

                    <button type="button" class="btn-success" id="btnGuardarFirma" onclick="guardarFirma()">
                        Guardar Firma
                    </button>

                    <button type="button" class="btn-secondary" onclick="BasicDemoClearSign()">
                        Limpiar
                    </button>
                </div>

                <div class="status" id="estado">
                    Tablet lista para firmar
                </div>
            </div>

            <div class="card preview">
                <div class="card-title">Vista Previa</div>
                <img 
                    id="firmaImg"
                    alt="Firma digital"
                    style="
                        min-height:60px;
                        max-width:100%;
                        display:none;
                        margin:0 auto;
                        border:1px solid #ddd;
                        padding:10px;
                        border-radius:10px;
                        background:white;
                    "
                >
            </div>

        </form>

        <p id="extVersion"></p>
        <p id="nmhVersion"></p>
    </div>

    <script src="/js/firma/firma.js"></script>
</body>
</html>
